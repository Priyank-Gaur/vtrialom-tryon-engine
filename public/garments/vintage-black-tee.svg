<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Dark fabric gradient -->
    <linearGradient id="teeBlackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="60%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <!-- Graphic gradient -->
    <linearGradient id="cyberGraphic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="teeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#teeShadow)">
    <!-- Main Body & Sleeves -->
    <path d="
      M 238 95
      C 264 132, 336 132, 362 95
      L 435 106
      L 538 212
      L 486 262
      L 434 220
      L 440 540
      L 160 540
      L 166 220
      L 114 262
      L 62 212
      L 165 106
      Z
    " fill="url(#teeBlackGrad)" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>

    <!-- Ribbed Collar -->
    <path d="
      M 234 94
      C 260 138, 340 138, 366 94
      C 356 86, 244 86, 234 94
      Z
    " fill="#111827" stroke="#4b5563" stroke-width="1.5"/>

    <!-- Streetwear Graphic Print on Chest -->
    <g transform="translate(200, 210)">
      <!-- Cyber background card -->
      <rect x="10" y="10" width="180" height="110" rx="8" fill="url(#cyberGraphic)" opacity="0.9"/>
      <rect x="13" y="13" width="174" height="104" rx="6" fill="#0f172a" opacity="0.85"/>
      <text x="100" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">VTRIALOM</text>
      <text x="100" y="78" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">// VIRTUAL TRY-ON //</text>
      <circle cx="100" cy="98" r="4" fill="#f43f5e"/>
      <circle cx="85" cy="98" r="2" fill="#06b6d4"/>
      <circle cx="115" cy="98" r="2" fill="#8b5cf6"/>
    </g>

    <!-- Subtle Stitching -->
    <path d="M 76 224 L 126 274" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 524 224 L 474 274" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 164 526 L 436 526" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
</svg>

