<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Oxford blue fabric gradient -->
    <linearGradient id="shirtBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shirtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#shirtShadow)">
    <!-- Main Shirt Body with Curved Hem -->
    <path d="
      M 240 85
      L 300 110
      L 360 85
      L 445 95
      L 540 220
      L 485 270
      L 435 230
      L 435 510
      C 435 550, 300 560, 300 560
      C 300 560, 165 550, 165 510
      L 165 230
      L 115 270
      L 60 220
      L 155 95
      Z
    " fill="url(#shirtBlueGrad)" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>

    <!-- Center Button Placket -->
    <path d="M 288 110 L 288 560 L 312 560 L 312 110 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>

    <!-- Pearl Buttons -->
    <circle cx="300" cy="155" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="300" cy="225" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="300" cy="295" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="300" cy="365" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="300" cy="435" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="300" cy="505" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>

    <!-- Left Chest Pocket -->
    <path d="M 210 220 L 260 220 L 260 275 L 235 295 L 210 275 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>

    <!-- Shirt Collar (Left & Right points) -->
    <!-- Left Collar Point -->
    <path d="M 240 85 L 290 145 L 300 110 L 255 75 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <!-- Right Collar Point -->
    <path d="M 360 85 L 310 145 L 300 110 L 345 75 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  </g>
</svg>

